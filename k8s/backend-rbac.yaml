apiVersion: v1
kind: ServiceAccount
metadata:
  name: wooforge-api-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wooforge-orchestrator-role
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
      - pods/log
      - services
      - persistentvolumeclaims
      - configmaps
      - secrets
      - resourcequotas
      - limitranges
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wooforge-orchestrator-binding
subjects:
  - kind: ServiceAccount
    name: wooforge-api-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: wooforge-orchestrator-role
  apiGroup: rbac.authorization.k8s.io
