apiVersion: apps/v1
kind: Deployment
metadata:
  name: wooforge-api
  namespace: default
  labels:
    app: wooforge-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wooforge-api
  template:
    metadata:
      labels:
        app: wooforge-api
    spec:
      serviceAccountName: wooforge-api-sa
      containers:
      - name: api
        image: wooforge/api:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: K8S_AUTH_MODE
          value: "incluster"
        - name: SECRET_KEY
          value: "replace-with-production-random-secret"
        - name: JWT_SECRET_KEY
          value: "replace-with-production-jwt-secret-32-chars"
        - name: BASE_DOMAIN
          value: "local.dev"
        - name: INGRESS_CLASS
          value: "nginx"
        - name: DATABASE_URL
          value: "sqlite:////data/wooforge.db"
        ports:
        - containerPort: 5000
          name: http
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: wooforge-data-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wooforge-data-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: wooforge-api
  namespace: default
spec:
  ports:
  - port: 5000
    targetPort: 5000
    name: http
  selector:
    app: wooforge-api
